name: CI Patient Service Pipeline
on:  #Trigers
  push:
    branches:
      - develop
    paths:
      - 'patient-service/**'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'patient-service/**'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write


    steps:
      - name: Cloning code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration  JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'patient-service/pom.xml'

      - name: Build project
        run: |
          cd patient-service
          mvn clean compile -B

      - name: Execute unit tests
        run: |
          cd patient-service
          mvn test -B

      - name: Qodana Code Quality Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --project-dir,patient-service

      - name: Build docker image
        run: |
          cd patient-service
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build -f ./infra/Dockerfile -t patient-backend:$SHORT_SHA .

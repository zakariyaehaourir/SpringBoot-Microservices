services:
  evaluation.database:
    container_name: evaluation-service-database
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_evaluation_backup:/var/lib/postgresql/data
    networks:
      - app-network

  evaluation.api:
    container_name: evaluation-backend
    build:
      context: .
      dockerfile: ./infra/Dockerfile
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://evaluation.database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      app-network:

    depends_on:
      evaluation.database:
        condition: service_healthy


volumes:
  db_evaluation_backup:

networks:
  app-network:
    external: true
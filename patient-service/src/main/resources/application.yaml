spring:
  application:
    name: patient-service
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      mode: always


grpc:
  client:
    invoicing-channel:
      address: ${GRPC_SERVER:static://127.0.0.1:9090}
      secure: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

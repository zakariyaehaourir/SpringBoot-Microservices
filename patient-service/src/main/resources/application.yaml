spring:
  application:
    name: patient-service
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      mode: always


  grpc:
    client:
      channels:
        invoicing-channel:
          address: "${GRPC_INVOICING_URL:static://localhost:9090}"
          secure: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
